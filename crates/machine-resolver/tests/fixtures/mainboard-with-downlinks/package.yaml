package:
  namespace: boards
  name: example-mainboard
  version: 1.0.0
  kind: board

chip: chips/generic-mcu

hardware:
  manufacturer: Example
  model: Mainboard
  revision: "1.0"

connectors:
  motor0:
    kind: stepper_driver_socket
    pins:
      step: PE11
      dir: PE10
      enable: PE9
      uart: PE7
    voltage_domain: logic_3v3

  motor1:
    kind: stepper_driver_socket
    pins:
      step: PD5
      dir: PD4
      enable: PD3
      uart: PD1
    voltage_domain: logic_3v3

  motor2:
    kind: stepper_driver_socket
    pins:
      step: PE13
      dir: PE14
      enable: PE15
      uart: PE8
    voltage_domain: logic_3v3

  motor3:
    kind: stepper_driver_socket
    pins:
      step: PD7
      dir: PD8
      enable: PD9
      uart: PD10
    voltage_domain: logic_3v3

  heater0:
    kind: power_output
    pin: PA2
    max_current: 5 A
    supply: vin

  thermistor0:
    kind: analog_input
    pin: PF4
    pullup: 4.7 kOhm

  accel0:
    kind: accessory_socket
    pins:
      sck: PA5
      miso: PA6
      mosi: PA7
      cs: PB0
    voltage_domain: logic_3v3

  accel1:
    kind: accessory_socket
    pins:
      sck: PD11
      miso: PD12
      mosi: PD13
      cs: PD14
    voltage_domain: logic_3v3

transports:
  usb:
    peripheral: usb_fs

downlinks:
  can0:
    type: can

flash:
  default_method: dfu
  methods:
    dfu:
      transport: usb
      select:
        usb_vid: "0x1209"
        usb_pid: "0xd003"
      enter_bootloader:
        - Hold BOOT while tapping RESET, then release BOOT.
      verify: sha256
      recovery:
        - Re-enter DFU mode and retry with the same locked artifact.
        - If DFU is unavailable, use the board's hardware recovery probe.
