name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: schema fixtures validate
        run: cargo run -p dryer-machine-parser --example validate examples/minimal-cartesian/machine.yaml
      - name: fixture machine resolves against the fixture registry
        run: cargo run -p dryer-machine-resolver --example resolve examples/minimal-cartesian/machine.yaml
      - name: golden lockfile has not drifted
        run: |
          cargo run -p dryer-machine-lock --example lock examples/minimal-cartesian/machine.yaml -o examples/minimal-cartesian/machine.lock
          git diff --exit-code examples/minimal-cartesian/machine.lock
